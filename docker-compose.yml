services:
  eurang-novel:
    image: caddy:2-alpine
    container_name: eurang-novel
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8103:8103"
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8103/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
